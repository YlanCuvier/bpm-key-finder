<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BPM & Key Finder</title>
<style>
  :root { --bg:#0f0f12; --card:#1a1a20; --line:#2a2a33; --text:#f2f2f5; --dim:#8b8b97; --accent:#fa2d48; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width:680px; margin:0 auto; padding:40px 16px; }
  h1 { font-size:26px; margin:0 0 4px; }
  p.sub { color:var(--dim); margin:0 0 24px; }
  input { width:100%; padding:14px 16px; font-size:17px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); outline:none; }
  input:focus, select:focus { border-color:var(--accent); }
  .bar { display:flex; gap:8px; }
  .tabs { display:flex; gap:6px; margin-bottom:10px; }
  .tabs button, .artist-btn { padding:7px 14px; border-radius:999px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; font-size:14px; }
  .tabs button.on, .artist-btn.on { background:var(--accent); border-color:var(--accent); }
  .artists { display:flex; flex-wrap:wrap; gap:8px; margin-top:16px; }
  .artist-btn small { color:var(--dim); margin-left:6px; }
  .count { color:var(--dim); font-size:13px; margin:16px 0 0; }
  .bar input { flex:1; min-width:0; }
  select { padding:0 10px; font-size:15px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); outline:none; }
  ul { list-style:none; padding:0; margin:20px 0 0; }
  li { cursor:pointer; display:flex; align-items:center; gap:12px; padding:10px; border-bottom:1px solid var(--line); }
  li img { width:52px; height:52px; border-radius:6px; flex:none; }
  .meta { flex:1; min-width:0; }
  .title { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .title a { color:inherit; text-decoration:none; }
  .title a:hover { text-decoration:underline; }
  .artist { color:var(--dim); font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .stat { text-align:center; min-width:64px; }
  .stat b { display:block; font-size:20px; font-variant-numeric:tabular-nums; }
  .stat span { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; }
  .stat.keycol { min-width:96px; }
  .stat.keycol span { text-transform:none; }
  .stat.keycol b { font-size:17px; white-space:nowrap; }
  .play { flex:none; width:36px; height:36px; border-radius:50%; border:none; background:var(--line); color:var(--text); cursor:pointer; font-size:14px; }
  .play.on { background:var(--accent); }
  .msg { color:var(--dim); text-align:center; padding:24px 0; }
  footer { color:var(--dim); font-size:12px; margin-top:24px; text-align:center; }
  @media (max-width:480px) { .stat { min-width:50px; } .stat.keycol { min-width:76px; } .stat.keycol b { font-size:13px; } .stat b { font-size:16px; } li img { width:44px; height:44px; } }
</style>
</head>
<body>
<main>
  <h1>BPM & Key Finder</h1>
  <p class="sub">Search any song on Apple Music. Tempo and key show up right away.</p>
  <div class="tabs"><button data-mode="song" class="on">Songs</button><button data-mode="artist">Artist</button></div>
  <div class="bar">
    <input id="q" type="search" placeholder="Song or artist…" autofocus autocomplete="off">
    <select id="country" title="Apple Music store">
      <option value="fr" selected>🇫🇷 FR</option><option value="us">🇺🇸 US</option><option value="gb">🇬🇧 UK</option>
      <option value="be">🇧🇪 BE</option><option value="ca">🇨🇦 CA</option><option value="de">🇩🇪 DE</option>
    </select>
  </div>
  <div id="artists" class="artists"></div>
  <div id="count" class="count"></div>
  <ul id="results"></ul>
  <footer>Analyzed from Apple Music's 30-second preview, in memory. Nothing gets saved to disk. Values are estimates.</footer>
</main>

<script>
const $q = document.getElementById('q'), $country = document.getElementById('country'), $list = document.getElementById('results');
const $artists = document.getElementById('artists'), $count = document.getElementById('count');
const player = new Audio();
let searchId = 0, timer, mode = 'song';

$q.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 400); });
$country.addEventListener('change', search);
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach(x => x.classList.toggle('on', x === b));
  mode = b.dataset.mode;
  $q.placeholder = mode === 'artist' ? 'Artist name… (e.g. Jolagreen23)' : 'Song or artist…';
  search(); $q.focus();
});

async function api(path) {
  const res = await fetch(path), data = await res.json();
  if (!res.ok) throw new Error(data.error);
  return data;
}

async function search() {
  const term = $q.value.trim(), id = ++searchId;
  $artists.innerHTML = $count.textContent = $list.innerHTML = '';
  if (!term) return;
  $list.innerHTML = '<div class="msg">Searching…</div>';
  try {
    if (mode === 'song') {
      const songs = await api(`/api/search?country=${$country.value}&term=${encodeURIComponent(term)}`);
      if (id === searchId) showSongs(songs, id);
      return;
    }
    const artists = await api(`/api/artists?country=${$country.value}&term=${encodeURIComponent(term)}`);
    if (id !== searchId) return;
    $list.innerHTML = artists.length ? '' : '<div class="msg">No artist found. Try another store or spelling.</div>';
    for (const a of artists) {
      const b = document.createElement('button');
      b.className = 'artist-btn';
      b.textContent = a.artistName;
      if (a.primaryGenreName) b.insertAdjacentHTML('beforeend', `<small>${a.primaryGenreName}</small>`);
      b.onclick = () => loadArtist(a);
      $artists.appendChild(b);
    }
    if (artists.length === 1) loadArtist(artists[0]);
  } catch (e) { if (id === searchId) $list.innerHTML = `<div class="msg">Search failed: ${e.message}</div>`; }
}

async function loadArtist(a) {
  const id = ++searchId;
  $artists.querySelectorAll('.artist-btn').forEach(b => b.classList.toggle('on', b.firstChild.textContent === a.artistName));
  $count.textContent = '';
  $list.innerHTML = `<div class="msg">Loading every ${a.artistName} song…</div>`;
  try {
    const songs = await api(`/api/artist?country=${$country.value}&id=${a.artistId}`);
    if (id !== searchId) return;
    $count.textContent = `${songs.length} songs by ${a.artistName}`;
    showSongs(songs, id);
  } catch (e) { if (id === searchId) $list.innerHTML = `<div class="msg">Loading failed: ${e.message}</div>`; }
}

function showSongs(songs, id) {
  if (!songs.length) { $list.innerHTML = '<div class="msg">No songs found. Try another store or spelling.</div>'; return; }
  $list.innerHTML = '';
  const rows = songs.map(renderRow);
  // Analyze a few at a time so the top results finish first
  let next = 0;
  const worker = async () => {
    while (next < songs.length && id === searchId) {
      const i = next++;
      await runAnalysis(rows[i], songs[i]);
    }
  };
  for (let w = 0; w < 4; w++) worker();
}

async function runAnalysis(li, s) {
  if (li.dataset.state === 'busy' || li.dataset.state === 'done') return;
  li.dataset.state = 'busy';
  fill(li, '…', '…', 'Key');
  try {
    const res = await fetch(`/api/analyze?url=${encodeURIComponent(s.previewUrl)}`);
    const r = await res.json();
    if (!res.ok) throw new Error(r.error);
    fill(li, r.bpm, r.key, r.alt ? `${r.camelot} · or ${r.alt}` : `Key · ${r.camelot}`);
    if (r.alt) li.querySelector('.cam').title = 'Close call between these two keys. Check by ear.';
    li.dataset.state = 'done';
  } catch (e) {
    fill(li, '⟳', '⟳', 'retry');
    li.title = `Analysis failed (${e.message}). Click to retry.`;
    li.dataset.state = 'error';
  }
}

function renderRow(s) {
  const li = document.createElement('li');
  li.innerHTML = `
    <button class="play" title="Play preview">▶</button>
    <img src="${s.artworkUrl100}" alt="">
    <div class="meta"><div class="title"></div><div class="artist"></div></div>
    <div class="stat"><b class="bpm">…</b><span>BPM</span></div>
    <div class="stat keycol"><b class="key">…</b><span class="cam">Key</span></div>`;
  const title = li.querySelector('.title');
  title.innerHTML = `<a target="_blank" rel="noopener" title="Open in Apple Music"></a>`;
  title.firstChild.href = s.trackViewUrl;
  title.firstChild.textContent = s.trackName;
  title.firstChild.onclick = (e) => e.stopPropagation();
  const year = (s.releaseDate || '').slice(0, 4);
  li.querySelector('.artist').textContent = [s.artistName, s.collectionName, year].filter(Boolean).join(' · ');
  li.onclick = () => runAnalysis(li, s);
  const btn = li.querySelector('.play');
  btn.onclick = (e) => {
    e.stopPropagation();
    runAnalysis(li, s);
    const playing = player.src === s.previewUrl && !player.paused;
    resetButtons();
    if (playing) { player.pause(); return; }
    player.src = s.previewUrl; player.play();
    btn.classList.add('on'); btn.textContent = '❚❚';
  };
  $list.appendChild(li);
  return li;
}

function fill(li, bpm, key, label) {
  li.querySelector('.bpm').textContent = bpm;
  li.querySelector('.key').textContent = key;
  li.querySelector('.cam').textContent = label;
}

function resetButtons() {
  document.querySelectorAll('.play.on').forEach(b => { b.classList.remove('on'); b.textContent = '▶'; });
}
player.onended = resetButtons;
</script>
</body>
</html>
